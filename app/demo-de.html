<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HuntersFeeder</title>
<style>:root{
--c1:#D95F27;
--c2:#4E8B3D;
--c3:#B58A12;
--feed:#8A5A2B;
--bg:#E9EAE2; --surface:#FBFBF6; --surface-2:#F1F2EA; --surface-3:#E8EADF;
--ink:#191C13; --ink-2:#565C49; --ink-3:#878D75;
--line:#D6D9C8; --line-2:#C7CBB6;
--crit:#C23A2C; --crit-wash:#F7E0DC;
--c1-hi:   color-mix(in oklab, var(--c1) 82%, #000);
--c1-wash: color-mix(in oklab, var(--c1) 13%, var(--surface));
--c2-hi:   color-mix(in oklab, var(--c2) 82%, #000);
--c2-wash: color-mix(in oklab, var(--c2) 13%, var(--surface));
--c3-hi:   color-mix(in oklab, var(--c3) 82%, #000);
--c3-wash: color-mix(in oklab, var(--c3) 15%, var(--surface));
--feed-hi: color-mix(in oklab, var(--feed) 78%, #000);
--feed-lo: color-mix(in oklab, var(--feed) 68%, #fff);
--on-c1:#fff; --on-c2:#fff; --on-c3:#fff;
--r:16px; --r-sm:11px; --r-xs:8px; --r-pill:999px;
--s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
--t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-lg:17px; --t-xl:22px; --t-2xl:30px;
--shadow:0 1px 2px rgba(25,28,19,.05), 0 8px 24px -12px rgba(25,28,19,.18);
--ease:cubic-bezier(.4,0,.2,1);
--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--level-feed:.72;
--level-batt:.82;
}
[data-theme="dark"]{
--bg:#0C0E09; --surface:#181B12; --surface-2:#20241A; --surface-3:#282D1F;
--ink:#EEEFE4; --ink-2:#A2A891; --ink-3:#71785F;
--line:#2C3122; --line-2:#3A4030;
--crit:#E5604E; --crit-wash:#3A1D18;
--c1-hi:   color-mix(in oklab, var(--c1) 78%, #fff);
--c1-wash: color-mix(in oklab, var(--c1) 20%, var(--surface));
--c2-hi:   color-mix(in oklab, var(--c2) 78%, #fff);
--c2-wash: color-mix(in oklab, var(--c2) 20%, var(--surface));
--c3-hi:   color-mix(in oklab, var(--c3) 78%, #fff);
--c3-wash: color-mix(in oklab, var(--c3) 22%, var(--surface));
--feed-hi: color-mix(in oklab, var(--feed) 74%, #fff);
--feed-lo: color-mix(in oklab, var(--feed) 62%, #000);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
.phone{width:100%;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);
color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;
border-radius:0;box-shadow:none}
@media (min-width:600px) and (min-height:900px){
body{background:#6B6F5E;display:grid;place-items:center;
background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.10) 1px,transparent 0);
background-size:24px 24px}
.phone{width:390px;height:844px;border-radius:44px;
box-shadow:0 0 0 1px rgba(0,0,0,.28),0 30px 60px -20px rgba(0,0,0,.45)}
}
.statusbar{height:52px;flex:0 0 auto;display:flex;align-items:flex-end;
justify-content:space-between;padding:0 28px 6px;font-size:13.5px;font-weight:640}
.statusbar .si{display:flex;gap:6px;align-items:center;opacity:.9}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;
height:30px;background:#000;border-radius:var(--r-pill);z-index:5}
.phone[data-chrome="off"] .statusbar{height:env(safe-area-inset-top,0px);padding:0}
.phone[data-chrome="off"] .statusbar>*{display:none}
.phone[data-chrome="off"] .notch{display:none}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);
padding:var(--s2) var(--s3) var(--s3) var(--s5);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:var(--t-xl);font-weight:680;letter-spacing:-.02em;flex:1;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1.sm{font-size:var(--t-lg)}
.topbar .ic{display:flex;gap:6px;flex:0 0 auto}
.content{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
padding:var(--s4) var(--s4) var(--s5);display:flex;flex-direction:column;
gap:var(--s3);scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.navbar{flex:0 0 auto;display:flex;gap:2px;
padding:var(--s2) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom,0px) * .25);
background:var(--surface);border-top:1px solid var(--line)}
.navbar button{flex:1 1 0;min-width:0;background:none;border:0;padding:var(--s2) 0 var(--s1);
border-radius:var(--r-sm);font:inherit;font-size:var(--t-xs);font-weight:600;
color:var(--ink-3);cursor:pointer;display:flex;flex-direction:column;
align-items:center;gap:4px;transition:color .18s var(--ease)}
.navbar button .navicon{width:46px;height:28px;display:grid;place-items:center;
border-radius:var(--r-pill);transition:background .18s var(--ease)}
.navbar button.active{color:var(--c1)}
.navbar button.active .navicon{background:var(--c1-wash)}
.phone[data-nav="hidden"] .navbar{display:none}
.view{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.view[data-anim="push"]{animation:vpush .22s var(--ease)}
.view[data-anim="pop"]{animation:vpop .20s var(--ease)}
.view[data-anim="fade"]{animation:vfade .16s var(--ease)}
@keyframes vpush{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes vpop{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
@keyframes vfade{from{opacity:0}to{opacity:1}}
.view{touch-action:pan-y pinch-zoom}
.view[data-anim="swl"]{animation:vswl .2s var(--ease)}
.view[data-anim="swr"]{animation:vswr .2s var(--ease)}
@keyframes vswl{from{transform:translateX(56px);opacity:0}to{transform:none;opacity:1}}
@keyframes vswr{from{transform:translateX(-56px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
.view[data-anim]{animation:none}
*{transition-duration:.01ms !important}
}
.phone[data-conn="lost"] .content{opacity:.55;filter:saturate(.6)}
.offline{display:none;font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;
text-transform:uppercase;color:var(--crit)}
.phone[data-conn="lost"] .offline{display:block}
.aptimer{display:none;font-size:var(--t-xs);font-weight:700;color:var(--c3-hi);
background:var(--c3-wash);border-radius:var(--r-pill);padding:2px 8px}
.phone[data-ap="soon"] .aptimer{display:block}
.busy{position:absolute;inset:0;z-index:60;display:none;place-items:center;
background:rgba(0,0,0,.55);padding:var(--s4)}
.busy:not([hidden]){display:grid}
.busybox{background:var(--surface);border-radius:var(--r-lg);
padding:var(--s5) var(--s4);width:min(82%,300px);text-align:center;
box-shadow:0 20px 50px -12px rgba(0,0,0,.5)}
.busyring{width:54px;height:54px;margin:0 auto var(--s3);display:block}
.busyring circle{fill:none;stroke:var(--c1);stroke-width:5;stroke-linecap:round;
stroke-dasharray:92 126;transform-origin:50% 50%;animation:busyspin 1s linear infinite}
@keyframes busyspin{to{transform:rotate(360deg)}}
.busytext{font-size:var(--t-lg);font-weight:660;line-height:1.3}
.busychart{margin:var(--s3) 0 0}
.busychart:empty{display:none}
.busybar{height:6px;background:var(--surface-3);border-radius:var(--r-pill);
overflow:hidden;margin:var(--s3) 0 var(--s2)}
.busybar i{display:block;height:100%;width:0;background:var(--c1);
border-radius:var(--r-pill);transition:width .25s linear}
.busyhint{font-size:var(--t-xs);color:var(--ink-3);line-height:1.45}
@media (prefers-reduced-motion:reduce){ .busyring circle{animation:none} }
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,12px);
background:var(--ink);color:var(--surface);padding:10px var(--s4);
border-radius:var(--r-pill);font-size:var(--t-sm);font-weight:600;z-index:40;
opacity:0;pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--crit);color:#fff}
.savebar{flex:0 0 auto;display:none;gap:var(--s2);padding:var(--s3) var(--s4)
calc(var(--s3) + env(safe-area-inset-bottom,0px));background:var(--surface);
border-top:1px solid var(--line)}
.savebar.on{display:flex}
.savebar .btn{flex:1}
.i{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;
stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:17px;height:17px}
.i.lg{width:26px;height:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
padding:var(--s4);box-shadow:var(--shadow)}
.card.flush{padding:2px var(--s4)}
.card.pad0{padding:0;overflow:hidden}
.sec{font-size:calc(var(--t-xs) * 1.6 * .9);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
color:var(--ink-3);margin:var(--s3) 0 calc(var(--s1) * -1);padding-left:2px}
.muted{color:var(--ink-3);font-size:var(--t-sm)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lead{display:flex;align-items:center;gap:var(--s3);min-width:0}
.name{font-size:var(--t-md);font-weight:560}
.hint{font-size:var(--t-xs);color:var(--ink-3);margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:var(--s3);padding:7px 0;font-size:var(--t-sm)}
.kv .k{color:var(--ink-3);flex:0 0 auto}
.kv .v{font-family:var(--mono);font-weight:600;text-align:right;word-break:break-all}
.navlist{display:flex;flex-direction:column}
.navlist a{display:flex;align-items:center;gap:var(--s3);padding:13px var(--s4);
text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);cursor:pointer}
.navlist a:last-child{border-bottom:0}
.navlist .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
background:var(--surface-2);color:var(--ink-2);flex:0 0 auto;
font-size:var(--t-xs);font-weight:700;letter-spacing:.04em}
.navlist .tx{flex:1;min-width:0}
.navlist .tx b{display:block;font-size:var(--t-md);font-weight:580}
.navlist .tx span{display:block;font-size:var(--t-xs);color:var(--ink-3);margin-top:1px}
.navlist .chev{color:var(--ink-3);flex:0 0 auto}
.navlist a.danger .ico{background:var(--crit-wash);color:var(--crit)}
.navlist a.dev .ico{background:var(--c1-wash);color:var(--c1)}
.gauge{display:flex;gap:var(--s4);align-items:center}
.barrel{width:104px;height:132px;flex:0 0 auto}
.barrel .fillg{transform:translateY(calc((1 - var(--level-feed)) * 118px));
transition:transform .6s var(--ease)}
.barrel .fill{fill:var(--feed);transition:fill .3s var(--ease)}
.barrel .fill-2{fill:var(--feed-lo);transition:fill .3s var(--ease)}
.barrel .body{fill:none;stroke:var(--line-2);stroke-width:3}
.barrel .band{stroke:var(--line-2);stroke-width:2.5;opacity:.75}
.barrel .glass{fill:var(--surface-2)}
.barrel .cap{fill:var(--surface-3);stroke:var(--line-2);stroke-width:2.5}
[data-feed="low"] .barrel .fill{fill:var(--c3)}
[data-feed="empty"] .barrel .fill{fill:var(--crit)}
[data-feed="empty"] .barrel .fill-2{fill:var(--crit)}
.gaugebody{min-width:0;flex:1}
.gaugebody .pct{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1}
.gaugebody .pct .u{font-size:17px;font-weight:600;color:var(--ink-3);margin-left:2px}
.gaugebody .st{margin-top:var(--s2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid2 .card{padding:var(--s3) var(--s3) var(--s4)}
.lbl{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:660;
letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c2);flex:0 0 auto}
.dot.warn{background:var(--c3)}
.dot.crit{background:var(--crit)}
.big{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.03em;margin:var(--s2) 0;line-height:1}
.big.sm{font-size:19px}
.big .u{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:2px}
.bar{height:6px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--c2);
transition:width .5s var(--ease)}
.bar>i.c1{background:var(--c1)}
.bar>i.warn{background:var(--c3)}
.bar>i.crit{background:var(--crit)}
.bars{display:flex;align-items:flex-end;gap:5px;height:40px}
.bars span{width:12px;border-radius:3px;background:var(--surface-3)}
.bars span.lit{background:var(--c2)}
.hero{display:flex;gap:var(--s4);align-items:center;background:var(--surface);
border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);box-shadow:var(--shadow)}
.ring{width:86px;height:86px;flex:0 0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-3)}
.ring .prog{stroke:var(--c1);stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center}
.ring .rc b{font-size:var(--t-lg);font-weight:700;letter-spacing:-.02em}
.herobody{min-width:0}
.herobody .k{font-size:var(--t-xs);font-weight:660;letter-spacing:.06em;text-transform:uppercase;
color:var(--ink-3)}
.herobody .clock{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:5px 0 var(--s2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:640;
padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--ink-2)}
.tag.on{background:var(--c2-wash);color:var(--c2-hi)}
.tag.warn{background:var(--c3-wash);color:var(--c3-hi)}
.tag.crit{background:var(--crit-wash);color:var(--crit)}
button{font:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;
padding:13px var(--s4);border:0;border-radius:var(--r-sm);background:var(--c1);
color:var(--on-c1);font-size:var(--t-md);font-weight:650;cursor:pointer;
transition:background .18s var(--ease),transform .1s var(--ease)}
.btn:active{transform:scale(.985)}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost{background:none;color:var(--c1)}
.btn.danger{background:var(--crit);color:#fff}
.btn.feed{padding:19px;font-size:var(--t-lg);font-weight:700;border-radius:var(--r);
box-shadow:0 8px 20px -8px var(--c1)}
.btn.auto{width:auto;padding:9px 14px;font-size:var(--t-xs)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-pill);
border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.iconbtn.plain{border:0;background:none}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);
border-radius:var(--r-sm);padding:3px;flex:0 0 auto}
.stepper button{width:32px;height:30px;border:0;border-radius:var(--r-xs);background:var(--surface);
color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stepper .num{min-width:58px;text-align:center;font-size:var(--t-sm);font-weight:660}
.sw{width:46px;height:27px;border-radius:var(--r-pill);background:var(--line-2);position:relative;
display:block;margin:0;padding:0;border:0;-webkit-appearance:none;appearance:none;
cursor:pointer;flex:0 0 auto;transition:background .22s var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .22s var(--ease)}
.sw.on{background:var(--c2)}
.sw.on i{transform:translateX(19px)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border:0;border-radius:var(--r-xs);background:none;
color:var(--ink-2);font-size:var(--t-xs);font-weight:640;cursor:pointer;white-space:nowrap}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.phone input[type=text],.phone input[type=password],.phone input[type=tel],
.phone input[type=time],.phone input[type=datetime-local]{width:100%;
padding:12px var(--s3);border:1px solid var(--line-2);border-radius:var(--r-sm);
background:var(--surface);color:var(--ink);font:inherit;
font-size:16px}
.phone input:focus{outline:2px solid var(--c1);outline-offset:-1px;border-color:transparent}
.phone label{display:block;font-size:var(--t-xs);font-weight:660;letter-spacing:.05em;
text-transform:uppercase;color:var(--ink-3);margin:var(--s3) 0 6px}
.field{margin-bottom:var(--s2)}
.banner{display:flex;gap:var(--s2);align-items:flex-start;padding:10px var(--s3);
border-radius:var(--r-sm);font-size:var(--t-sm);font-weight:560;
background:var(--c3-wash);color:var(--c3-hi);border:1px solid var(--c3)}
.banner.crit{background:var(--crit-wash);color:var(--crit);border-color:var(--crit)}
.banner.ok{background:var(--c2-wash);color:var(--c2-hi);border-color:var(--c2)}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--c1);
border-radius:var(--r-sm);padding:var(--s3);font-size:var(--t-sm);color:var(--ink-2);line-height:1.55}
.note p{margin:0 0 8px}
.note p:last-child{margin:0}
.console{background:var(--surface-3);border-radius:var(--r-sm);padding:var(--s3);
font-family:var(--mono);font-size:var(--t-xs);line-height:1.75;color:var(--ink-2);
max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.console b{color:var(--c2);font-weight:600}
.console .e{color:var(--crit)}
.console .p{color:var(--c1)}
.console .d{color:var(--ink-3)}
.progbar{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.progbar>i{display:block;height:100%;background:var(--c1);border-radius:var(--r-pill)}
.chip{display:inline-block;padding:3px 9px;border-radius:var(--r-pill);font-size:var(--t-xs);
font-weight:640;background:var(--surface-3);color:var(--ink-2);font-family:var(--mono)}
.chip.ok{background:var(--c2-wash);color:var(--c2-hi)}
.chip.no{background:var(--crit-wash);color:var(--crit)}
.chip.warn{background:var(--c3-wash);color:var(--c3-hi)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--c1-wash);color:var(--c1);
display:grid;place-items:center;font-size:var(--t-sm);font-weight:700;flex:0 0 auto}
.calstat{font-size:var(--t-lg);font-weight:660;line-height:1.35}
.minichart{width:100%;height:110px;display:block;overflow:visible}
.minichart .gridln{stroke:var(--line);stroke-width:1}
.minichart .trace{fill:none;stroke:var(--c1);stroke-width:2;
stroke-linejoin:round;stroke-linecap:round}
.minichart .trace.live{stroke:var(--c3)}
.minichart .thr{stroke:var(--crit);stroke-width:1;stroke-dasharray:3 3}
.minichart .lbl{font-size:9px;fill:var(--ink-3);font-family:var(--mono)}
.mono          { font-family:var(--mono); font-size:var(--t-sm) }
.spaced        { margin-top:var(--s3) }
.spaced-sm     { margin-top:var(--s2) }
.nobottom      { padding-bottom:0 }
.tight         { padding-top:0 }
.borderless    { border:0 }
.danger-text   { color:var(--crit) }
.btnrow        { display:flex; gap:var(--s2) }
.chiprow       { display:flex; gap:6px; flex-wrap:wrap; margin-top:var(--s3) }
.tagrow        { display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s3) }

(function (HF) {
  "use strict";
  function renderTabs() {
    var bar = HF.util.$("#navbar");
    bar.innerHTML = HF.screens.tabs().map(function (s) {
      return '<button data-tab="' + s.id + '" role="tab">' +
             '<span class="navicon"><svg class="i"><use href="#' + s.tab.icon + '"/></svg></span>' +
             '<span data-i18n="' + s.tab.label + '">' + (s.tab.text || s.id) + '</span></button>';
    }).join("");
    HF.i18n.apply(bar);
  }
  function leave(fn) {
    if (!HF.form.failed()) { HF.form.flush(); fn(); return; }
    HF.sheet.confirm({ message: HF.i18n.t("app.leavedirty", "Unsaved changes will be lost. Continue?") })
      .then(function (ok) {
        if (!ok) return;
        HF.form.flush();
        fn();
      });
  }
  function buildTabs() {
    var bar = HF.util.$("#navbar");
    renderTabs();
    bar.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-tab]");
      if (!b) return;
      leave(function () { HF.router.selectTab(b.getAttribute("data-tab")); });
    });
  }
  function wireShell() {
    HF.util.$("#back").addEventListener("click", function () { leave(HF.router.back); });
    HF.swipe.init({
      tab:  function (tab, anim) { leave(function () { HF.router.selectTab(tab, anim); }); },
      back: function () { leave(HF.router.back); }
    });
    HF.util.$("#save").addEventListener("click", function () { HF.form.save(); });
    HF.util.$("#discard").addEventListener("click", function () { HF.form.discard(); });
    document.addEventListener("click", function (e) {
      var a = e.target.closest("[data-go]");
      if (!a) return;
      e.preventDefault();
      HF.router.go(a.getAttribute("data-go"),
                   a.hasAttribute("data-replace") ? { replace: true } : undefined);
    });
    document.addEventListener("click", function (e) {
      var a = e.target.closest("[data-action]");
      if (!a) return;
      e.preventDefault();
      var cmd = a.getAttribute("data-action");
      var need = a.getAttribute("data-confirm");
      var go = function () {
        a.disabled = true;
        try {
          document.dispatchEvent(new CustomEvent("hf:action", { detail: { cmd: cmd } }));
        } catch (e) {   }
        HF.api.action(cmd)
          .then(function () { HF.util.toast(HF.i18n.t("app.done", "Done")); })
          .catch(function () { HF.util.toast(HF.i18n.t("app.failed", "Failed"), true); })
          .then(function () { a.disabled = false; });
      };
      if (!need) { go(); return; }
      HF.sheet.confirm({ message: HF.i18n.t(need, need) }).then(function (ok) { if (ok) go(); });
    });
    window.addEventListener("hashchange", function () {
      var r = location.hash.slice(1);
      if (r) HF.router.go(r, { replace: true });
    });
  }

    HF.i18n.init();

    });

      if (s["hw.modem"] != null) HF.screens.setModemPresent(s["hw.modem"]);

    });

p itself turns the auger and will dispense.</span></div>","system":"<div class=\"sec\" data-i18n=\"sy.firmware\">Firmware</div>\n<div class=\"card\">\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.version\">version</span><span class=\"v\" data-bind=\"sys.fw\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.built\">built</span><span class=\"v\" data-bind=\"sys.built\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.commit\">commit</span><span class=\"v\" data-bind=\"sys.commit\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.board\">board</span><span class=\"v\" data-bind=\"sys.board\"></span></div>\n</div>\n<div class=\"sec\" data-i18n=\"sy.identity\">Identity</div>\n<div class=\"card\">\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.serial\">serial</span><span class=\"v\" data-bind=\"sys.serial\"></span></div>\n  <div class=\"kv\"><span class=\"k\">MAC</span><span class=\"v\" data-bind=\"sys.mac\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.imei\">modem IMEI</span><span class=\"v\" data-bind=\"sys.imei\"></span></div>\n</div>\n<div class=\"sec\" data-i18n=\"sy.health\">Health</div>\n<div class=\"card\">\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.uptime\">uptime</span><span class=\"v\" data-bind=\"sys.uptime_s\" data-fmt=\"uptime\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.restarts\">restarts</span><span class=\"v\" data-bind=\"sys.restarts\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.resetcause\">last reset cause</span><span class=\"v\" data-bind=\"sys.reset_cause\" data-fmt=\"rc\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.heap\">free heap</span><span class=\"v\" id=\"heap\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"sy.flash\">flash used</span><span class=\"v\" data-bind=\"sys.flash_used\"></span></div>\n  <div class=\"bar\" class=\"spaced-sm\"><i class=\"c1\ ield\" type=\"button\" data-addedit=\"name\"><span class=\"v\" id=\"an\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n  <div class=\"field\">\n    <label data-i18n=\"pe.fphone\">Phone number</label>\n    <button class=\"tapfield\" type=\"button\" data-addedit=\"phone\"><span class=\"v\" id=\"ap\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n  <div class=\"field\">\n    <label data-i18n=\"pe.frights\">What they may do</label>\n    <div class=\"seg\" id=\"arights\">\n      <button data-r=\"0\" class=\"active\" data-i18n=\"pe.rbasic\">Receive only</button>\n      <button data-r=\"1\" data-i18n=\"pe.rfull\">Full control</button>\n    </div>\n    <div class=\"hint\" id=\"arighthint\"></div>\n  </div>\n  <div class=\"hint\" data-i18n=\"pe.smsonly\"></div>\n  <div class=\"btnrow spaced\">\n    <button class=\"btn ghost\" id=\"acancel\" data-i18n=\"app.cancel\">Cancel</button>\n    <button class=\"btn\" id=\"asave\"></button>\n  </div>\n  <button class=\"btn secondary danger-text\" id=\"aremove\" hidden>\n    <svg class=\"i\"><use href=\"#ic-trash\"/></svg><span data-i18n=\"pe.removethis\">Remove this person</span></button>\n</div>\n<div class=\"hint\" data-i18n=\"pe.taphint\">Tap a person to change their name, number or rights.</div>\n<button class=\"btn\" id=\"add\"><svg class=\"i\"><use href=\"#ic-plus\"/></svg><span data-i18n=\"pe.add\">Add person</span></button>\n<div class=\"note\" data-i18n=\"pe.note\">Anyone not on this list is ignored. An SMS from an unknown number is logged and dropped \u2014 it never reaches the motor.</div>","personal":"<div class=\"sec\" data-i18n=\"pd.owner\">Owner</div>\n<div class=\"card flush\">\n  <div class=\"row stack\">\n    <div class=\"name\" data-i18n=\"pd.name\">Name</div>\n    <button class=\"tapfield\" type=\"button\" data-edit=\"name\"><span class=\"v mono\" id=\"v-name\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n  <div class=\"row stack\">\n    <div class=\"name\" data-i18n=\"pd.surname\">Surname</div>\n    <button class=\"tapfield\" type=\"button\" data-edit=\"surname\"><span class=\"v mono\" id=\"v-surname\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n  <div class=\"row stack\">\n    <div class=\"name\" data-i18n=\"pd.phone\">Phone number</div>\n    <button class=\"tapfield\" type=\"button\" data-edit=\"phone\"><span class=\"v mono\" id=\"v-phone\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n</div>\n<div class=\"hint\" data-i18n=\"pd.phonenote\">Alerts are sent here. This number always has full rights.</div>\n<div class=\"sec\" id=\"simsec\" data-i18n=\"pd.sim\">SIM in the feeder</div>\n<div class=\"card flush\" id=\"simcard\">\n  <div class=\"row stack\">\n    <div class=\"name\" data-i18n=\"pd.msisdn\">SIM number (MSISDN)</div>\n    <button class=\"tapfield\" type=\"button\" data-edit=\"msisdn\"><span class=\"v mono\" id=\"v-msisdn\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n  <div class=\"row stack\">\n    <div class=\"name\" data-i18n=\"pd.pin\">SIM PIN</div>\n    <button class=\"tapfield\" type=\"button\" data-edit=\"pin\"><span class=\"v mono\" id=\"v-pin\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n  <div class=\"simwarn\" id=\"simwarn\" hidden data-i18n=\"pd.simwarn\">SIM is locked or missing</div>\n  <div class=\"row\">\n    <div><div class=\"name\" data-i18n=\"pd.rememberpin\">Remember PIN</div>\n      <div class=\"hint\" data-i18n=\"pd.rememberpinsub\">Needed for unattended restarts</div></div>\n    <div class=\"sw\" data-cfg-toggle=\"sim.remember_pin\"><i></i></div>\n  </div>\n  <div class=\"row\">\n    <div><div class=\"name\" data-i18n=\"pd.state\">state</div></div>\n    <span class=\"v mono\" id=\"simstate\"></span>\n  </div>\n</div>\n<div class=\"sec\" data-i18n=\"pd.wifi\">This feeder's Wi-Fi</div>\n<div class=\"card flush\">\n  <div class=\"row stack\">\n    <div class=\"name\" data-i18n=\"pd.appass\">Wi-Fi password</div>\n    <button class=\"tapfield\" type=\"button\" data-edit=\"appass\"><span class=\"v mono\" id=\"v-appass\"></span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n  </div>\n</div>\n<div class=\"hint\" data-i18n=\"pd.appassnote\">Applied the next time the feeder turns its Wi-Fi on, not right now - the network you are using to read this is the one being changed. Leave it empty for an open network.</div>\n<div class=\"banner\"><svg class=\"i sm\" style=\"margin-top:1px\"><use href=\"#ic-lock\"/></svg>\n  <span data-i18n=\"pd.privacy\">Stored on the device only. Never transmitted except as SMS from your own SIM.</span></div>","sms":"<div class=\"note\" data-i18n=\"sms.note\">Text these to the feeder's SIM number from a number on the Persons list. Case does not matter.</div>\n<div class=\"card flush\">\n  <div class=\"row\"><div><div class=\"name mono\">POMOC</div>\n    <div class=\"hint\" data-i18n=\"sms.c.help\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">NAVODILA</div>\n    <div class=\"hint\" data-i18n=\"sms.c.instr\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">INFORMACIJE</div>\n    <div class=\"hint\" data-i18n=\"sms.c.info\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">HRANI</div>\n    <div class=\"hint\" data-i18n=\"sms.c.feed\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">HRANI X</div>\n    <div class=\"hint\" data-i18n=\"sms.c.feedx\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">AON | AOFF</div>\n    <div class=\"hint\" data-i18n=\"sms.c.aon\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">TRAJANJE X</div>\n    <div class=\"hint\" data-i18n=\"sms.c.dur\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">LOKACIJA</div>\n    <div class=\"hint\" data-i18n=\"sms.c.loc\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">DOMOV</div>\n    <div class=\"hint\" data-i18n=\"sms.c.home\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">UPORABNIKI</div>\n    <div class=\"hint\" data-i18n=\"sms.c.users\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">DODAJ Ime Tel</div>\n    <div class=\"hint\" data-i18n=\"sms.c.add\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">IZBRISI X</div>\n    <div class=\"hint\" data-i18n=\"sms.c.del\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">PRAVICE X FULL | BASIC</div>\n    <div class=\"hint\" data-i18n=\"sms.c.rights\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">VKLOPI | IZKLOPI</div>\n    <div class=\"hint\" data-i18n=\"sms.c.wifi\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">ODBLOKIRAJ</div>\n    <div class=\"hint\" data-i18n=\"sms.c.jam\"></div></div></div>\n  <div class=\"row\"><div><div class=\"name mono\">PONASTAVI</div>\n    <div class=\"hint\" data-i18n=\"sms.c.reset\"></div></div></div>\n</div>\n<div class=\"sec\" data-i18n=\"sms.alertsec\">Alerts the feeder sends</div>\n<div class=\"card\">\n  <div class=\"seg\" id=\"alertseg\">\n    <button data-lvl=\"0\" data-i18n=\"sms.lvloff\">Off</button>\n    <button data-lvl=\"1\" data-i18n=\"sms.lvlbasic\">Basic</button>\n    <button data-lvl=\"2\" data-i18n=\"sms.lvlext\">Extended</button>\n    <button data-lvl=\"3\" data-i18n=\"sms.lvlall\">All</button>\n  </div>\n  <div id=\"lvldetail\" class=\"lvldetail\"></div>\n</div>\n<div class=\"sec\" data-i18n=\"sms.capsec\">Daily SMS limit</div>\n<div class=\"card\">\n  <div class=\"row\">\n    <div><div class=\"name\" data-i18n=\"sms.cap\">SMS per day</div>\n      <div class=\"hint\"><span data-i18n=\"sms.today\">Sent today</span>\n        <span data-bind=\"sms.today\">0</span> / <span id=\"capof\">30</span></div></div>\n    <div class=\"stepper\"><button data-capstep=\"-5\">&minus;</button>\n      <span class=\"num\"><span data-bind=\"sms.day_cap\">30</span></span>\n      <button data-capstep=\"5\">+</button></div>\n  </div>\n  <div class=\"hint\" data-i18n=\"sms.caphint\"></div>\n</div>\n<div class=\"sec\" data-i18n=\"sms.replies\">Replies</div>\n<div class=\"card\">\n  <div class=\"hint\" data-i18n=\"sms.example\">Example reply</div>\n  <div class=\"console\">&gt; INFORMACIJE\nBat [/////] 91% SIM 4092 ADC 4146mV\nSig [/////] 100% -51dBm\nHrana ZADOSTI IR 180 ref 150 prag 195\nAvto DA cez 5h14m, zadnje pred 8h33m\nMotor v redu</div>\n</div>\n<div class=\"banner\">\n  <svg class=\"i sm\" style=\"margin-top:1px\"><use href=\"#ic-info\"/></svg>\n  <span data-i18n=\"sms.cost\">Each command and reply is one SMS on the feeder's SIM.</span>\n</div>","dev-login":"<div class=\"card pad-hero\">\n  <svg class=\"i lg\"><use href=\"#ic-lock\"/></svg>\n  <div class=\"headline\" data-i18n=\"dv.enter\">Enter developer password</div>\n  <div class=\"muted lead-in\" data-i18n=\"dv.warn\">\n    Everything past this point can put the feeder in a state it cannot recover from on its own.</div>\n  <input type=\"password\" id=\"pw\"\n         inputmode=\"numeric\" autocomplete=\"off\" data-i18n-ph=\"dv.password\">\n  <button class=\"btn spaced\" id=\"unlock\" data-i18n=\"dv.unlock\">Unlock</button>\n  <div class=\"muted spaced\" data-i18n=\"dv.relock\">Re-locks automatically after 10 minutes</div>\n</div>\n<div class=\"sec\" data-i18n=\"dv.whatunlocks\">What unlocks</div>\n<div class=\"card pad0\"><div class=\"navlist\">\n  <a><span class=\"ico\"><svg class=\"i sm\"><use href=\"#ic-bolt\"/></svg></span>\n    <span class=\"tx\"><b data-i18n=\"dev.power\">Power</b><span data-i18n=\"dv.powersub\">Voltage graph, supply, undervoltage limits</span></span></a>\n  <a><span class=\"ico\"><svg class=\"i sm\"><use href=\"#ic-term\"/></svg></span>\n    <span class=\"tx\"><b data-i18n=\"dev.terminal\">Terminal</b><span data-i18n=\"dv.termsub\">Full AT command access</span></span></a>\n  <a><span class=\"ico\"><svg class=\"i sm\"><use href=\"#ic-chip\"/></svg></span>\n    <span class=\"tx\"><b data-i18n=\"dev.memory\">Memory</b><span data-i18n=\"dv.memsub\">Raw EEPROM / NVS dump</span></span></a>\n  <a><span class=\"ico\"><svg class=\"i sm\"><use href=\"#ic-code\"/></svg></span>\n    <span class=\"tx\"><b data-i18n=\"dev.logs\">Logs</b><span data-i18n=\"dv.logsub\">UART and debug streams</span></span></a>\n</div></div>","dev-power":"<div class=\"seg\" id=\"devseg\"></div>\n<div class=\"sec\" data-i18n=\"pw.live\">Live measurement</div>\n<div class=\"card\">\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.inuse\">in use</span>\n    <span class=\"v\" id=\"bestmv\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.viamodem\">via modem (AT+CBC)</span>\n    <span class=\"v\" id=\"modemmv\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.viaadc\">via ESP32 ADC (GPIO39)</span>\n    <span class=\"v\" id=\"packmv\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.motorv\">motor rail (GPIO34)</span>\n    <span class=\"v\" id=\"motorv\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.charge_pct\">charge</span>\n    <span class=\"v\" data-bind=\"batt.pct\" data-fmt=\"pct\"></span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.reading\">reading</span>\n    <span class=\"v\" id=\"freshness\"></span></div>\n  <div class=\"bar spaced-sm\"><i id=\"battbar\" style=\"width:0%\"></i></div>\n  <button class=\"btn secondary spaced\" data-action=\"pwr.sample\">\n    <svg class=\"i\"><use href=\"#ic-refresh\"/></svg><span data-i18n=\"pw.sample\">Sample now</span></button>\n  <p class=\"hint spaced-sm\" data-i18n=\"pw.cbcnote\">Measured by the modem (AT+CBC), not by an ADC pin - so a reading needs the modem awake, and it sags under load.</p>\n</div>\n<div class=\"sec\" data-i18n=\"pw.limits\">Limits this firmware uses</div>\n<div class=\"card\">\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.full\">full (100 %)</span>\n    <span class=\"v\"><span data-bind=\"batt.full_mv\"></span> mV</span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.empty\">empty (0 %)</span>\n    <span class=\"v\"><span data-bind=\"batt.empty_mv\"></span> mV</span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.crit\">critical</span>\n    <span class=\"v\"><span data-bind=\"batt.critical_mv\"></span> mV</span></div>\n  <div class=\"kv\"><span class=\"k\" data-i18n=\"pw.gasp\">dying-gasp shutdown</span>\n    <span class=\"v\" id=\"gasp\"></span></div>\n  <p class=\"hint spaced-sm\" data-i18n=\"pw.gaspnote\">The dying gasp sends a last SMS and sleeps with no wake source. It is off: this pack sags under Wi-Fi and modem load, and it was triggering on a healthy battery.</p>\n</div>\n<div class=\"banner\">\n  <svg class=\"i sm\" style=\"margin-top:1px\"><use href=\"#ic-info\"/></svg>\n  <span data-i18n=\"pw.nohistory\">No voltage history is recorded on this device, so there is no graph to draw.</span>\n</div>","dev-terminal":"<div class=\"seg\" id=\"devseg\"></div>\n<div class=\"conhead\">\n  <div class=\"lbl\" data-i18n=\"tm.modem\">Modem \u00b7 SIM7070G</div>\n  <div class=\"conhead-r\">\n    <span class=\"chip\" id=\"simstate\">-</span>\n    <button class=\"btn secondary auto\" id=\"clearcon\" data-i18n=\"tm.clear\">Clear</button>\n  </div>\n</div>\n<div class=\"console big\" id=\"con\"><span class=\"d\" data-i18n=\"tm.ready\">ready</span></div>\n<div id=\"cmdsections\"></div>\n<div class=\"sec\" data-i18n=\"tm.manual\">Type a command yourself</div>\n<div class=\"card\">\n  <div class=\"lockin\">\n    <button class=\"tapfield\" type=\"button\" id=\"atedit\"><span class=\"v mono atcmd\" id=\"atval\">AT+CPSI?</span><svg class=\"i sm editmark\"><use href=\"#ic-edit\"/></svg></button>\n    <button class=\"btn auto sendicon\" id=\"send\" data-i18n-aria=\"app.send\"><svg class=\"i\"><use href=\"#ic-send\"/></svg></button>\n  </div>\n  <p class=\"hint\" data-i18n=\"tm.manualhint\">Press the pencil, type the command, Save - it is sent at once. The arrow sends it again.</p>\n</div>\n<div class=\"banner crit\">\n  <svg class=\"i sm\" style=\"margin-top:1px\"><use href=\"#ic-alert\"/></svg>\n  <span data-i18n=\"tm.atwarn\">Raw AT can deregister the modem. Recovery needs physical access.</span>\n</div>","dev-memory":"<div class=\"seg\" id=\"devseg\"></div>\n<div class=\"sec\" data-i18n=\"mem.space\">Space</div>\n<div class=\"card\" id=\"memspace\"></div>\n<div class=\"sec\" data-i18n=\"mem.usage\">Numbers</div>\n<div class=\"card\" id=\"memstats\"></div>\n<div class=\"sec\" data-i18n=\"mem.stored\">Stored values</div>\n<div class=\"card flush\" id=\"nvslist\"></div>\n<div class=\"sec\" data-i18n=\"mem.parts\">Partitions</div>\n<div class=\"card flush\" id=\"parts\"></div>\n<div class=\"btnrow spaced\">\n  <button class=\"btn secondary\" id=\"reload\">\n    <svg class=\"i\"><use href=\"#ic-refresh\"/></svg><span data-i18n=\"mem.reload\">Reload</span></button>\n  <button class=\"btn secondary\" id=\"exportjson\">\n    <svg class=\"i\"><use href=\"#ic-dl\"/></svg><span data-i18n=\"mem.export\">Export .json</span></button>\n</div>\n<button class=\"btn secondary danger-text spaced-sm\" id=\"erase\" data-i18n=\"mem.erase\">Erase NVS</button>\n<div class=\"banner crit\">\n  <svg class=\"i sm\" style=\"margin-top:1px\"><use href=\"#ic-alert\"/></svg>\n  <span data-i18n=\"mem.erasewarn\">Erasing NVS is a factory reset: settings, persons, calibration and the SIM PIN all go.</span>\n</div>","dev-logs":"<div class=\"seg\" id=\"devseg\"></div>\n<div class=\"conhead\">\n  <div class=\"lbl\" data-i18n=\"lg.live\">Happening now \u00b7 RAM</div>\n  <span class=\"chip\" id=\"held\">-</span>\n</div>\n<div class=\"console big\" id=\"log\"></div>\n<div class=\"card\">\n  <div class=\"lockin\">\n    <input type=\"text\" id=\"lgfilter\" spellcheck=\"false\" autocapitalize=\"off\"\n           autocorrect=\"off\" autocomplete=\"off\" class=\"mono\"\n           data-i18n-ph=\"lg.filterph\" readonly>\n    <button class=\"btn secondary auto\" id=\"unlockfilter\" data-i18n=\"app.edit\">Edit</button>\n  </div>\n  <div class=\"row borderless nobottom\">\n    <div><div class=\"name\" data-i18n=\"lg.follow\">Follow tail</div>\n      <div class=\"hint\" data-i18n=\"lg.followsub\">Auto-scroll as lines arrive</div></div>\n    <div class=\"sw on\" id=\"follow\"><i></i></div>\n  </div>\n</div>\n<div class=\"conhead spaced\">\n  <div class=\"lbl\" data-i18n=\"lg.saved\">Last saved fault \u00b7 flash</div>\n  <button class=\"btn secondary auto\" id=\"reloadsnap\">\n    <svg class=\"i sm\"><use href=\"#ic-refresh\"/></svg></button>\n</div>\n<div class=\"console mid flash\" id=\"snap\"></div>\n<p class=\"hint\" data-i18n=\"lg.savednote\">Written when the firmware last recorded an error, and kept through power cuts and deep sleep. Empty means nothing has gone wrong since the last factory reset.</p>\n<div class=\"sec\" data-i18n=\"lg.errors\">Errors recorded</div>\n<div class=\"card flush\" id=\"errring\"></div>\n<div class=\"sec\" data-i18n=\"lg.saved2\">Saved sessions</div>\n<div class=\"card flush\" id=\"faultlist\"></div>\n<p class=\"hint\" data-i18n=\"lg.savednote2\">When something fails, the whole session is written to flash \u2014 everything from the moment the feeder woke up to the moment it went wrong, not just the last few lines.</p>\n<div class=\"sec\" data-i18n=\"lg.settings\">What to keep</div>\n<div class=\"card flush\">\n  <div class=\"row\">\n    <div><div class=\"name\" data-i18n=\"lg.saveonfault\">Save the session when something fails</div>\n      <div class=\"hint\" data-i18n=\"lg.saveonfaultsub\">Written to the feeder's own storage, so it survives a power cut</div></div>\n    <div class=\"sw\" data-cfg-toggle=\"log.save_on_fault\"><i></i></div>\n  </div>\n  <div class=\"row\">\n    <div><div clas <script>
/* ============================================================================
   demo-extras.js - injected into app/demo-*.html by tools/update-app-demo.sh,
   after the V3 bundle. Website only; nothing here reaches the firmware.

   The V3 demo backend (80-mock.js) keeps a fixed countdown and a fixed 20:30
   dusk, and the drawn status bar always says 9:41. On the website the visitor
   should see the app as it would look on their phone right now, so:

     - the status bar shows the real local time, and the device clock in
       Feeding is the real time too (or what the visitor set it to),
     - dusk is today's real civil dusk at the demo position (Ljubljana),
     - "next feeding" is computed from the schedule the visitor has set
       (fixed time or dusk + offset), exactly as the device would,
     - the one hard-coded English demo toast is translated.

   It wraps HF.mock.handle() rather than editing the mock, so a V3 rebuild
   never needs this file changed unless those key names change.
   ========================================================================== */
(function (HF) {
  "use strict";
  if (!HF || !HF.mock || !HF.mock.handle) return;

  var LAT = 46.056946, LON = 14.505751;          /* the demo's GNSS position */
  var RAD = Math.PI / 180;

  /* Civil dusk (sun 6 deg below the horizon, evening) for the UTC calendar day
     containing `ms`. Standard sunrise equation; within a minute or two of the
     almanac, which is all a demo needs. */
  function civilDusk(ms) {
    var jd = Math.floor(ms / 86400000) + 0.5 + 2440587.5;     /* that day, 12:00 UTC */
    var n = Math.ceil(jd - 2451545.0 + 0.0008);
    var js = n - LON / 360;
    var M = (357.5291 + 0.98560028 * js) % 360;
    var C = 1.9148 * Math.sin(M * RAD) + 0.02 * Math.sin(2 * M * RAD) + 0.0003 * Math.sin(3 * M * RAD);
    var L = (M + C + 180 + 102.9372) % 360;
    var jt = 2451545.0 + js + 0.0053 * Math.sin(M * RAD) - 0.0069 * Math.sin(2 * L * RAD);
    var dec = Math.asin(Math.sin(L * RAD) * Math.sin(23.4397 * RAD));
    var cw = (Math.sin(-6 * RAD) - Math.sin(LAT * RAD) * Math.sin(dec)) /
             (Math.cos(LAT * RAD) * Math.cos(dec));
    var w = Math.acos(Math.max(-1, Math.min(1, cw))) / RAD;
    return Math.round((jt + w / 360 - 2440587.5) * 86400);    /* Unix seconds */
  }

  /* The next dusk (+offset) that is still ahead of `now`. */
  function nextDusk(now, offsetMin) {
    for (var d = -1; d <= 2; d++) {
      var t = civilDusk((now + d * 86400) * 1000) + offsetMin * 60;
      if (t > now) return t;
    }
    return now + 86400;
  }

  /* sched.times is "HH:MM[,HH:MM...]" in UTC; the next of them still ahead. */
  function nextFixed(now, times) {
    var best = null;
    String(times || "").split(",").forEach(function (hm) {
      var p = hm.trim().split(":");
      if (p.length < 2) return;
      var day = Math.floor(now / 86400) * 86400;
      var t = day + (+p[0]) * 3600 + (+p[1]) * 60;
      if (t <= now) t += 86400;
      if (best === null || t < best) best = t;
    });
    return best;
  }

  /* Device clock = the visitor's real clock, plus whatever they set by hand in
     Feeding > Device time, so practising that edit works and then keeps
     ticking from the new value. The app's own boot-time set-time call sends
     the phone clock, which leaves the offset at ~0. */
  var offset = 0;

  var orig = HF.mock.handle;
  HF.mock.handle = function (method, path, body) {
    if (method === "POST" && path === "/api/set-time" && body && body.epoch)
      offset = body.epoch - Math.floor(Date.now() / 1000);
    var p = orig.apply(this, arguments);
    if (method !== "GET" || path !== "/api/state") return p;
    return p.then(function (s) {
      if (!s) return s;
      var now = Math.floor(Date.now() / 1000);
      s["time.now"] = now + offset;
      s["dusk.base_at"] = nextDusk(now, 0);
      var at = null;
      if (s["sched.enabled"]) {
        at = s["sched.mode"] === "dusk"
          ? nextDusk(now, s["sched.dusk_offset_min"] || 0)
          : nextFixed(now, s["sched.times"]);
      }
      if (at) {
        s["next.at"] = at;
        s["next.in_s"] = at - now;
        s["next.interval_s"] = 86400;
        s["next.mode"] = s["sched.mode"] === "dusk" ? "dusk" : "fixed";
      } else {
        /* Auto-feed off: the device sends no next.* at all, and the UI shows "-". */
        delete s["next.at"]; delete s["next.in_s"]; delete s["next.interval_s"]; delete s["next.mode"];
      }
      return s;
    });
  };

  /* ---- live status-bar clock ----------------------------------------------- */
  function clock() {
    var el = document.querySelector("#app .statusbar > span:first-child");
    if (!el) return;
    var d = new Date();
    el.textContent = d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  clock();
  setInterval(clock, 1000);

  /* ---- the mock's one hard-coded English string ------------------------------ */
  var DEMO = { sl: "Demo način · brez naprave", en: "Demo mode · no device",
               hr: "Demo način · bez uređaja", it: "Modalità demo · nessun dispositivo",
               de: "Demomodus · kein Gerät" };
  if (HF.util && HF.util.toast) {
    var toast = HF.util.toast;
    HF.util.toast = function (msg) {
      var args = Array.prototype.slice.call(arguments);
      if (msg === "Demo mode · no device" && HF.i18n) args[0] = DEMO[HF.i18n.current()] || msg;
      return toast.apply(this, args);
    };
  }
})(window.HF);

</script>
