<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HuntersFeeder — zasloni aplikacije</title>
<meta name="description" content="Vsi zasloni aplikacije HuntersFeeder na enem platnu — pregled stanja, urnik krmljenja, lokacija, umerjanje in razvijalska orodja.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== ICON SPRITE (stroke, 24px, currentColor) ========= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5.5 9.6V20h13V9.6"/></symbol>
<symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/></symbol>
<symbol id="ic-pin" viewBox="0 0 24 24"><path d="M12 21.5s7-6.4 7-11.2A7 7 0 0 0 5 10.3c0 4.8 7 11.2 7 11.2z"/><circle cx="12" cy="10" r="2.6"/></symbol>
<symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9.5" cy="8" r="3.4"/><path d="M3 20c0-3.7 3-5.6 6.5-5.6S16 16.3 16 20"/><path d="M17 5.4a3.3 3.3 0 0 1 0 6.4"/><path d="M18.5 14.8c1.7.7 2.8 2.1 2.8 4.4"/></symbol>
<symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3.1-6.2 7-6.2s7 2.2 7 6.2"/></symbol>
<symbol id="ic-tune" viewBox="0 0 24 24"><path d="M4 8h8M17.5 8H20M4 16h3.5M13 16h7"/><circle cx="14.5" cy="8" r="2.4"/><circle cx="10" cy="16" r="2.4"/></symbol>
<symbol id="ic-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11.2V16"/><path d="M12 7.8h.01"/></symbol>
<symbol id="ic-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></symbol>
<symbol id="ic-code" viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></symbol>
<symbol id="ic-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
<symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
<symbol id="ic-dl" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M8 11.5l4 4 4-4"/><path d="M5 19.5h14"/></symbol>
<symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5h-5"/></symbol>
<symbol id="ic-term" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 9.5l2.6 2.6-2.6 2.6M13 15h4"/></symbol>
<symbol id="ic-chip" viewBox="0 0 24 24"><rect x="7.5" y="7.5" width="9" height="9" rx="1.6"/><path d="M10 3.5v4M14 3.5v4M10 16.5v4M14 16.5v4M3.5 10h4M3.5 14h4M16.5 10h4M16.5 14h4"/></symbol>
<symbol id="ic-bolt" viewBox="0 0 24 24"><path d="M13.2 3L5.5 14h5.6l-1 7 7.9-11h-5.6z"/></symbol>
<symbol id="ic-alert" viewBox="0 0 24 24"><path d="M12 4.2l8.6 15.3H3.4z"/><path d="M12 10.2v4"/><path d="M12 17h.01"/></symbol>
<symbol id="ic-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.2"/><path d="M8 10.5V7.4a4 4 0 0 1 8 0v3.1"/></symbol>
<symbol id="ic-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.8h5V7"/><path d="M6.2 7l1 13h9.6l1-13"/></symbol>
<symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2L21 21"/></symbol>
<symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="ic-phone" viewBox="0 0 24 24"><path d="M6 3.5h4.2l1.8 4.4-2.5 1.7a11.6 11.6 0 0 0 4.9 4.9l1.7-2.5 4.4 1.8V18a2.5 2.5 0 0 1-2.6 2.5A16.6 16.6 0 0 1 3.5 6.1 2.5 2.5 0 0 1 6 3.5z"/></symbol>
<symbol id="ic-sat" viewBox="0 0 24 24"><path d="M5.5 12.5L11.5 6.5"/><rect x="2.6" y="10.4" width="5.8" height="4.2" rx="1" transform="rotate(-45 5.5 12.5)"/><rect x="9.6" y="3.4" width="5.8" height="4.2" rx="1" transform="rotate(-45 12.5 5.5)"/><path d="M13 13a5 5 0 0 1 0 7"/><path d="M16 16a9 9 0 0 1 0 4"/></symbol>
<symbol id="ic-drop" viewBox="0 0 24 24"><path d="M12 3.5s6 6.6 6 10.5a6 6 0 0 1-12 0c0-3.9 6-10.5 6-10.5z"/></symbol>
</defs></svg>

<!-- ===================== THEMING DOCK (canvas chrome, not the app) ========
     Public build. The four raw <input type="color"> swatches and the
     "Copy CSS" export are gone — those are authoring tools, not something a
     visitor has any use for. What stays is what someone can actually play
     with: the ready-made palettes, the two level sliders and light/dark.
     app.js guards every one of these ids, so removing more breaks nothing.
========================================================================= -->
<div class="dock">
  <strong>HuntersFeeder — zasloni aplikacije</strong>

  <div class="grp"><span class="lb">Barvna shema</span><span class="presets" id="presets"></span></div>

  <div class="grp"><span class="lb">Krma</span>
    <input type="range" id="rFeed" min="0" max="100" value="72"><span class="val" id="vFeed">72%</span></div>
  <div class="grp"><span class="lb">Baterija</span>
    <input type="range" id="rBatt" min="0" max="100" value="82"><span class="val" id="vBatt">82%</span></div>

  <div class="grp">
    <button id="tLight" class="on">Svetlo</button>
    <button id="tDark">Temno</button>
  </div>
</div>

<!-- The artboards themselves are an English-language UI mock-up; the dock
     above and the back button below are the Slovene page chrome. -->
<div class="canvas" lang="en">

<div class="group">Everyday — reachable from the tab bar</div>

<!-- ========================================================= 1. OVERVIEW -->
<figure class="board">
  <figcaption>01 · System overview <em>the only screen most owners open</em></figcaption>
  <div class="phone" id="pOverview" data-feed="ok" data-batt="ok">
    <div class="notch"></div>
    <div class="statusbar"><span>21:06</span><span class="si">▮▮▮ 82%</span></div>
    <div class="topbar">
      <h1>HuntersFeeder</h1>
      <div class="ic">
        <button class="iconbtn"><svg class="i sm"><use href="#ic-refresh"/></svg></button>
        <button class="iconbtn"><svg class="i sm"><use href="#ic-menu"/></svg></button>
      </div>
    </div>
    <div class="content">

      <!-- FEED LEVEL — the headline. A barrel, read at a glance. -->
      <div class="card">
        <div class="lbl"><svg class="i sm"><use href="#ic-drop"/></svg>Feed level</div>
        <div class="gauge" style="margin-top:var(--s3)">
          <svg class="barrel" viewBox="0 0 104 132">
            <defs><clipPath id="bc1">
              <path d="M18 14C6 40 6 92 18 118c28 8 40 8 68 0 12-26 12-78 0-104z"/>
            </clipPath></defs>
            <path class="glass" d="M18 14C6 40 6 92 18 118c28 8 40 8 68 0 12-26 12-78 0-104z"/>
            <g clip-path="url(#bc1)">
              <g class="fillg">
                <ellipse class="fill-2" cx="52" cy="14" rx="36" ry="8"/>
                <rect class="fill" x="0" y="14" width="104" height="120"/>
              </g>
            </g>
            <g clip-path="url(#bc1)">
              <path class="band" d="M2 48h100M2 88h100" fill="none"/>
            </g>
            <path class="body" d="M18 14C6 40 6 92 18 118c28 8 40 8 68 0 12-26 12-78 0-104z"/>
            <ellipse class="cap" cx="52" cy="14" rx="34" ry="8.5"/>
          </svg>
          <div class="gaugebody">
            <div class="pct" id="feedPct">72<span class="u">%</span></div>
            <div class="muted" id="feedSub">approx. 18 more feeds</div>
            <div class="st"><span class="tag on" id="feedTag">Hopper OK</span></div>
          </div>
        </div>
      </div>

      <!-- POWER + LINK -->
      <div class="grid2">
        <div class="card">
          <div class="lbl"><span class="dot" id="battDot"></span>Battery</div>
          <div style="display:flex;align-items:center;gap:10px;margin:var(--s3) 0 var(--s2)">
            <svg class="battery" viewBox="0 0 54 26">
              <rect class="fill" x="4" y="5.5" width="39" height="15" rx="2"/>
              <rect class="shell" x="1.6" y="3.2" width="43.8" height="19.6" rx="4.5"/>
              <rect class="cap" x="47.2" y="9" width="4.2" height="8" rx="1.6"/>
            </svg>
            <div style="font-size:var(--t-xl);font-weight:700;letter-spacing:-.03em" id="battPct">82<span class="u" style="font-size:13px;color:var(--ink-3)">%</span></div>
          </div>
          <div class="muted">12.42 V · charging</div>
        </div>
        <div class="card">
          <div class="lbl"><span class="dot"></span>Signal</div>
          <div class="big">61<span class="u">%</span></div>
          <div class="bars">
            <span class="lit" style="height:8px"></span><span class="lit" style="height:11px"></span>
            <span class="lit" style="height:14px"></span><span style="height:17px"></span><span style="height:20px"></span>
          </div>
          <div class="muted" style="margin-top:6px">LTE-M · Telekom</div>
        </div>
      </div>

      <!-- NEXT FEED -->
      <div class="hero">
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="43" fill="none" stroke-width="8"/>
            <circle class="prog" cx="50" cy="50" r="43" fill="none" stroke-width="8"
                    stroke-dasharray="270.2" stroke-dashoffset="94"/>
          </svg>
          <div class="rc"><b>2h14</b></div>
        </div>
        <div class="herobody">
          <div class="k">Next feed</div>
          <div class="clock">23:20</div>
          <div><span class="tag on">auto · dusk +30 m</span></div>
        </div>
      </div>

      <button class="btn feed"><svg class="i"><use href="#ic-drop"/></svg>Feed now</button>
    </div>
    <div class="navbar">
      <button class="active"><span class="navicon"><svg class="i"><use href="#ic-home"/></svg></span>Overview</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-clock"/></svg></span>Feeding</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-pin"/></svg></span>Location</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-menu"/></svg></span>Menu</button>
    </div>
  </div>
</figure>

<!-- ========================================================= 2. LOW / EMPTY -->
<figure class="board">
  <figcaption>02 · Overview — empty <em>same screen, alarm state</em></figcaption>
  <div class="phone" data-feed="empty" data-batt="crit" style="--level-feed:.04;--level-batt:.11">
    <div class="notch"></div>
    <div class="statusbar"><span>06:41</span><span class="si">▮ 11%</span></div>
    <div class="topbar">
      <h1>HuntersFeeder</h1>
      <div class="ic">
        <button class="iconbtn"><svg class="i sm"><use href="#ic-refresh"/></svg></button>
        <button class="iconbtn"><svg class="i sm"><use href="#ic-menu"/></svg></button>
      </div>
    </div>
    <div class="content">
      <div class="banner crit"><svg class="i sm" style="margin-top:1px"><use href="#ic-alert"/></svg>
        <span>Hopper empty and battery critical. Feeding suspended.</span></div>

      <div class="card">
        <div class="lbl"><svg class="i sm"><use href="#ic-drop"/></svg>Feed level</div>
        <div class="gauge" style="margin-top:var(--s3)">
          <svg class="barrel" viewBox="0 0 104 132">
            <defs><clipPath id="bc2">
              <path d="M18 14C6 40 6 92 18 118c28 8 40 8 68 0 12-26 12-78 0-104z"/>
            </clipPath></defs>
            <path class="glass" d="M18 14C6 40 6 92 18 118c28 8 40 8 68 0 12-26 12-78 0-104z"/>
            <g clip-path="url(#bc2)">
              <g class="fillg">
                <ellipse class="fill-2" cx="52" cy="14" rx="36" ry="8"/>
                <rect class="fill" x="0" y="14" width="104" height="120"/>
              </g>
            </g>
            <g clip-path="url(#bc2)"><path class="band" d="M2 48h100M2 88h100" fill="none"/></g>
            <path class="body" d="M18 14C6 40 6 92 18 118c28 8 40 8 68 0 12-26 12-78 0-104z"/>
            <ellipse class="cap" cx="52" cy="14" rx="34" ry="8.5"/>
          </svg>
          <div class="gaugebody">
            <div class="pct" style="color:var(--crit)">4<span class="u">%</span></div>
            <div class="muted">refill required</div>
            <div class="st"><span class="tag crit">Empty</span></div>
          </div>
        </div>
      </div>

      <div class="grid2">
        <div class="card">
          <div class="lbl"><span class="dot crit"></span>Battery</div>
          <div style="display:flex;align-items:center;gap:10px;margin:var(--s3) 0 var(--s2)">
            <svg class="battery" viewBox="0 0 54 26">
              <rect class="fill" x="4" y="5.5" width="39" height="15" rx="2"/>
              <rect class="shell" x="1.6" y="3.2" width="43.8" height="19.6" rx="4.5"/>
              <rect class="cap" x="47.2" y="9" width="4.2" height="8" rx="1.6"/>
            </svg>
            <div style="font-size:var(--t-xl);font-weight:700;color:var(--crit)">11<span style="font-size:13px">%</span></div>
          </div>
          <div class="muted">10.98 V · below cutoff</div>
        </div>
        <div class="card">
          <div class="lbl"><span class="dot warn"></span>Signal</div>
          <div class="big">22<span class="u">%</span></div>
          <div class="bars">
            <span class="lit" style="height:8px"></span><span style="height:11px"></span>
            <span style="height:14px"></span><span style="height:17px"></span><span style="height:20px"></span>
          </div>
          <div class="muted" style="margin-top:6px">LTE-M · weak</div>
        </div>
      </div>

      <button class="btn secondary"><svg class="i"><use href="#ic-drop"/></svg>Feed now (disabled)</button>
      <div class="note">Two failures are shown together because they share one cause: the panel has not charged since the hopper ran out, so nothing has drawn current. Fix the refill and the battery recovers.</div>
    </div>
    <div class="navbar">
      <button class="active"><span class="navicon"><svg class="i"><use href="#ic-home"/></svg></span>Overview</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-clock"/></svg></span>Feeding</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-pin"/></svg></span>Location</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-menu"/></svg></span>Menu</button>
    </div>
  </div>
</figure>

<!-- ========================================================= 3. FEEDING -->
<figure class="board">
  <figcaption>03 · Automatic feeding <em>schedule only — no calibration here</em></figcaption>
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span>21:07</span><span class="si">▮▮▮ 82%</span></div>
    <div class="topbar"><h1>Feeding</h1>
      <div class="ic"><button class="iconbtn"><svg class="i sm"><use href="#ic-menu"/></svg></button></div></div>
    <div class="content">
      <div class="card">
        <div class="row" style="border:0;padding:0">
          <div><div class="name">Automatic feeding</div><div class="hint">Run the schedule unattended</div></div>
          <div class="sw on"><i></i></div>
        </div>
      </div>

      <div class="sec">Schedule</div>
      <div class="card flush">
        <div class="row">
          <div><div class="name">Mode</div><div class="hint">Fixed interval or relative to dusk</div></div>
        </div>
        <div class="row" style="padding-top:0">
          <div class="seg" style="width:100%"><button>Interval</button><button class="active">Dusk</button></div>
        </div>
        <div class="row">
          <div><div class="name">Offset from dusk</div><div class="hint">−6 h to +6 h</div></div>
          <div class="stepper"><button>−</button><span class="num">+30 m</span><button>+</button></div>
        </div>
        <div class="row">
          <div><div class="name">Dusk today</div><div class="hint">Computed from GNSS position</div></div>
          <span class="chip">22:50</span>
        </div>
      </div>

      <div class="sec">Portion</div>
      <div class="card flush">
        <div class="row">
          <div><div class="name">Run duration</div><div class="hint">1–20 s</div></div>
          <div class="stepper"><button>−</button><span class="num">4 s</span><button>+</button></div>
        </div>
        <div class="row">
          <div><div class="name">Motor speed</div><div class="hint">Higher throws grain further</div></div>
          <div class="stepper"><button>−</button><span class="num">85 %</span><button>+</button></div>
        </div>
        <div class="row">
          <div><div class="name">Estimated portion</div><div class="hint">From the last calibration</div></div>
          <span class="chip ok">≈ 340 g</span>
        </div>
      </div>

      <div class="sec">Limits</div>
      <div class="card flush">
        <div class="row">
          <div><div class="name">Max feeds per day</div></div>
          <div class="stepper"><button>−</button><span class="num">2</span><button>+</button></div>
        </div>
        <div class="row">
          <div><div class="name">Pause below battery</div><div class="hint">Protects the pack overnight</div></div>
          <div class="stepper"><button>−</button><span class="num">20 %</span><button>+</button></div>
        </div>
      </div>

      <button class="btn"><svg class="i"><use href="#ic-check"/></svg>Save schedule</button>
    </div>
    <div class="navbar">
      <button><span class="navicon"><svg class="i"><use href="#ic-home"/></svg></span>Overview</button>
      <button class="active"><span class="navicon"><svg class="i"><use href="#ic-clock"/></svg></span>Feeding</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-pin"/></svg></span>Location</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-menu"/></svg></span>Menu</button>
    </div>
  </div>
</figure>

<!-- ========================================================= 4. LOCATION -->
<figure class="board">
  <figcaption>04 · Location / GNSS search <em>acquiring state shown</em></figcaption>
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span>21:08</span><span class="si">▮▮▮ 82%</span></div>
    <div class="topbar"><h1>Location</h1>
      <div class="ic"><button class="iconbtn"><svg class="i sm"><use href="#ic-menu"/></svg></button></div></div>
    <div class="content">
      <div class="card" style="text-align:center;padding:var(--s5) var(--s4)">
        <svg class="i lg" style="color:var(--c1);width:38px;height:38px"><use href="#ic-sat"/></svg>
        <div style="font-size:var(--t-lg);font-weight:660;margin-top:var(--s3)">Searching for satellites</div>
        <div class="muted" style="margin-top:4px">7 in view · 3 locked · needs 4</div>
        <div class="progbar" style="margin-top:var(--s4)"><i style="width:58%"></i></div>
        <div class="muted" style="margin-top:var(--s2)">cold start, typically 40–90 s</div>
      </div>

      <div class="sec">Last known fix</div>
      <div class="card">
        <div class="kv"><span class="k">latitude</span><span class="v">46.056946</span></div>
        <div class="kv"><span class="k">longitude</span><span class="v">14.505751</span></div>
        <div class="kv"><span class="k">age</span><span class="v">2 h 14 m</span></div>
        <div class="kv"><span class="k">accuracy</span><span class="v">±6 m (3D)</span></div>
        <div class="kv"><span class="k">from home</span><span class="v">18 m</span></div>
      </div>
      <button class="btn"><svg class="i"><use href="#ic-pin"/></svg>Open in Maps</button>
      <button class="btn secondary">Set this position as home</button>

      <div class="sec">Geofence</div>
      <div class="card flush">
        <div class="row">
          <div><div class="name">Theft alert</div><div class="hint">SMS if the feeder leaves the radius</div></div>
          <div class="sw on"><i></i></div>
        </div>
        <div class="row">
          <div><div class="name">Radius</div></div>
          <div class="stepper"><button>−</button><span class="num">100 m</span><button>+</button></div>
        </div>
      </div>

      <div class="sec">History</div>
      <div class="card flush">
        <div class="row"><div><div class="name" style="font-family:var(--mono);font-size:var(--t-sm)">09.09. 19:02</div>
          <div class="hint">46.05694, 14.50575 · 3D</div></div>
          <button class="iconbtn plain"><svg class="i sm"><use href="#ic-chev"/></svg></button></div>
        <div class="row"><div><div class="name" style="font-family:var(--mono);font-size:var(--t-sm)">09.09. 07:14</div>
          <div class="hint">46.05691, 14.50580 · 3D</div></div>
          <button class="iconbtn plain"><svg class="i sm"><use href="#ic-chev"/></svg></button></div>
      </div>
    </div>
    <div class="navbar">
      <button><span class="navicon"><svg class="i"><use href="#ic-home"/></svg></span>Overview</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-clock"/></svg></span>Feeding</button>
      <button class="active"><span class="navicon"><svg class="i"><use href="#ic-pin"/></svg></span>Location</button>
      <button><span class="navicon"><svg class="i"><use href="#ic-menu"/></svg></span>Menu</button>
    </div>
  </div>
</figure>

<!-- ========================================================= 5. MENU -->
<figure class="board">
  <figcaption>05 · Menu <em>the burger — everything that isn't daily</em></figcaption>
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span>21:09</span><span class="si">▮▮▮ 82%</span></div>
    <div class="topbar"><h1>Menu</h1>
      <div class="ic"><button class="iconbtn"><svg class="i sm"><use href="#ic-close"/></svg></button></div></div>
